name: CI Pipeline

# WHEN to run
on:
  pull_request:
    branches: [dev, main]   # runs when PR targets dev or main
  push:
    branches: [dev, main]   # runs when code pushed to dev or main

# WHAT to run
jobs:
  ci:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Build
        run: npm run build